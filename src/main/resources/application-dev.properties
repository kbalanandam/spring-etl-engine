spring.application.name=spring-etl-engine
spring.devtools.restart.enabled=false


# Named relational connection registry for connectionRef-based job bundles.
# With spring.profiles.default=dev, these are active by default for local runs.
etl.config.relational.connections.sqlserver-main.vendor=sqlserver
etl.config.relational.connections.sqlserver-main.connectionString=jdbc:sqlserver://localhost:1433;databaseName=etl_db;encrypt=true;trustServerCertificate=true
etl.config.relational.connections.sqlserver-main.usernameEnvVar=SQLSERVER_USERNAME
etl.config.relational.connections.sqlserver-main.passwordEnvVar=SQLSERVER_PASSWORD
etl.config.relational.connections.sqlserver-main.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Optional second connection example for additional relational jobs.
# etl.config.relational.connections.sqlserver-reporting.vendor=sqlserver
# etl.config.relational.connections.sqlserver-reporting.connectionString=jdbc:sqlserver://localhost:1433;databaseName=etl_reporting;encrypt=true;trustServerCertificate=true
# etl.config.relational.connections.sqlserver-reporting.usernameEnvVar=SQLSERVER_REPORTING_USERNAME
# etl.config.relational.connections.sqlserver-reporting.passwordEnvVar=SQLSERVER_REPORTING_PASSWORD
# etl.config.relational.connections.sqlserver-reporting.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver


# Dev metadata database settings (MySQL)
spring.datasource.url=${ETL_DEV_MYSQL_URL:jdbc:mysql://localhost:3306/etl_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${ETL_DEV_MYSQL_USERNAME:root}
spring.datasource.password=${ETL_DEV_MYSQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Spring Batch metadata schema
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=never


# Optional: show SQL logs
spring.jpa.show-sql=true
