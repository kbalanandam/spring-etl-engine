spring.application.name=spring-etl-engine-control-plane
spring.main.web-application-type=servlet
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
server.port=8081
etl.logging.base-dir=logs
controlplane.triggers.persistence.mode=jdbc
controlplane.triggers.persistence.mode-marker-path=.controlplane/trigger-event-persistence-mode.marker
controlplane.triggers.persistence.allow-mode-switch=false
controlplane.triggers.retention-per-job=500
controlplane.runs.persistence.mode=jdbc
controlplane.runs.retention=5000
controlplane.runs.min-reindex-interval-ms=1000
controlplane.db.vendor=${CONTROLPLANE_DB_VENDOR:mysql}
controlplane.db.url=${CONTROLPLANE_DB_URL:jdbc:mysql://localhost:3306/etl_controlplane?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
controlplane.db.username=${CONTROLPLANE_DB_USERNAME:root}
controlplane.db.password=${CONTROLPLANE_DB_PASSWORD:}
controlplane.db.driver-class-name=${CONTROLPLANE_DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
controlplane.schedules.persistence.mode=jdbc
controlplane.scheduler.enabled=true
controlplane.scheduler.poll-interval-ms=30000
controlplane.scheduler.missed-run-policy=SKIP
controlplane.scheduler.overlap-policy=ALLOW
controlplane.scheduler.max-catch-up-iterations=2000
controlplane.scheduler.launch-enabled=true
controlplane.job-launch.enabled=true
controlplane.job-launch.worker.datasource.url=${CONTROLPLANE_WORKER_DB_URL:${controlplane.db.url}}
controlplane.job-launch.worker.datasource.username=${CONTROLPLANE_WORKER_DB_USERNAME:${controlplane.db.username}}
controlplane.job-launch.worker.datasource.password=${CONTROLPLANE_WORKER_DB_PASSWORD:${controlplane.db.password}}
controlplane.job-launch.worker.datasource.driver-class-name=${CONTROLPLANE_WORKER_DB_DRIVER_CLASS_NAME:${controlplane.db.driver-class-name}}
controlplane.job-launch.worker.connection-init-sql=
controlplane.scheduler.trigger-reason=schedule_tick
controlplane.scheduler.requested-by=scheduler
spring.datasource.url=${controlplane.db.url}
spring.datasource.username=${controlplane.db.username}
spring.datasource.password=${controlplane.db.password}
spring.datasource.driver-class-name=${controlplane.db.driver-class-name}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.sql.init.mode=never
spring.batch.jdbc.initialize-schema=never

