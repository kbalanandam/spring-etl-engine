spring.application.name=spring-etl-engine-control-plane
spring.main.web-application-type=servlet
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
server.port=8081
etl.logging.base-dir=logs
controlplane.triggers.persistence.mode=jdbc
controlplane.triggers.persistence.mode-marker-path=.controlplane/trigger-event-persistence-mode.marker
controlplane.triggers.persistence.allow-mode-switch=false
controlplane.triggers.retention-per-job=500
controlplane.runs.persistence.mode=jdbc
controlplane.runs.retention=5000
controlplane.runs.min-reindex-interval-ms=1000
controlplane.schedules.persistence.mode=jdbc
controlplane.scheduler.enabled=true
controlplane.scheduler.poll-interval-ms=30000
controlplane.scheduler.missed-run-policy=SKIP
controlplane.scheduler.overlap-policy=ALLOW
controlplane.scheduler.max-catch-up-iterations=2000
controlplane.scheduler.launch-enabled=true
controlplane.job-launch.enabled=true
controlplane.job-launch.worker.datasource.url=${CONTROLPLANE_MYSQL_URL:jdbc:mysql://localhost:3306/etl_controlplane?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
controlplane.job-launch.worker.datasource.username=${CONTROLPLANE_MYSQL_USERNAME:root}
controlplane.job-launch.worker.datasource.password=${CONTROLPLANE_MYSQL_PASSWORD:}
controlplane.job-launch.worker.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
controlplane.job-launch.worker.connection-init-sql=
controlplane.scheduler.trigger-reason=schedule_tick
controlplane.scheduler.requested-by=scheduler
spring.datasource.url=${CONTROLPLANE_MYSQL_URL:jdbc:mysql://localhost:3306/etl_controlplane?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CONTROLPLANE_MYSQL_USERNAME:root}
spring.datasource.password=${CONTROLPLANE_MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.sql.init.mode=never
spring.batch.jdbc.initialize-schema=never

