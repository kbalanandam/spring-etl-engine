# Layer this profile with controlplane: --spring.profiles.active=controlplane,controlplane-mysql
# Example URL:
# jdbc:mysql://localhost:3306/etl_controlplane?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=${CONTROLPLANE_MYSQL_URL:jdbc:mysql://localhost:3306/etl_controlplane?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CONTROLPLANE_MYSQL_USERNAME:root}
spring.datasource.password=${CONTROLPLANE_MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=1

# Keep control-plane trigger/run linkage and worker writes on the same relational database.
controlplane.job-launch.worker.datasource.url=${CONTROLPLANE_MYSQL_URL:jdbc:mysql://localhost:3306/etl_controlplane?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

# Schema initialization remains externalized for relational deployments.
spring.sql.init.mode=never
spring.batch.jdbc.initialize-schema=never

