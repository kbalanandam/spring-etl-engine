version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      spring-boot-patch-line:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
          - "org.springframework.batch:*"
          - "org.springframework.data:*"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "UTC"
    commit-message:
      prefix: "ci"
      include: "scope"

